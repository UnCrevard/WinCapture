<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="sh2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg2)"/>

  <!-- Target Application Window -->
  <g filter="url(#sh2)">
    <rect x="160" y="95" width="960" height="535" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <path d="M160 105 a10 10 0 0 1 10 -10 h940 a10 10 0 0 1 10 10 v32 h-960 z" fill="#222227"/>
    <text x="184" y="120" fill="#e4e4e7" font-size="12.5" font-weight="600">Media Player — Preview Panel</text>

    <!-- Left navigation pane -->
    <rect x="161" y="137" width="210" height="492" fill="#131316"/>
    <rect x="176" y="158" width="180" height="30" rx="6" fill="#27272a"/>
    <text x="192" y="177" fill="#f4f4f5" font-size="12">Clips &amp; Captures</text>
    <text x="192" y="212" fill="#a1a1aa" font-size="12">Timeline</text>
    <text x="192" y="240" fill="#a1a1aa" font-size="12">Audio Tracks</text>

    <!-- Inner Panel Targeted by UI Automation (Red 3px outline g_hl) -->
    <rect x="392" y="156" width="698" height="442" rx="6" fill="#09090b"/>
    <rect x="440" y="210" width="600" height="310" rx="6" fill="#111827" stroke="#1f2937"/>
    <polygon points="715,325 715,405 780,365" fill="#38bdf8" opacity="0.85"/>
    <rect x="440" y="540" width="600" height="8" rx="4" fill="#27272a"/>
    <rect x="440" y="540" width="240" height="8" rx="4" fill="#38bdf8"/>

    <!-- g_hl 3px crimson highlight border around inner panel -->
    <rect x="392" y="156" width="698" height="442" fill="none" stroke="#ff3c3c" stroke-width="3.5"/>
  </g>

  <!-- WinCapture Floating Toolbar in Picking Mode (#0078D7) -->
  <g filter="url(#sh2)" transform="translate(360, 46)">
    <rect width="560" height="30" rx="3" fill="#0078d7" stroke="#3898e8" stroke-width="1"/>
    <g fill="#2b8ce0">
      <rect x="10" y="4" width="30" height="22" rx="2"/>
      <rect x="44" y="4" width="30" height="22" rx="2"/>
      <rect x="78" y="4" width="30" height="22" rx="2"/>
      <rect x="112" y="4" width="30" height="22" rx="2" fill="#005a9e"/>
      <rect x="146" y="4" width="30" height="22" rx="2"/>
      <rect x="184" y="4" width="30" height="22" rx="2"/>
      <rect x="218" y="4" width="30" height="22" rx="2"/>
    </g>
    <circle cx="25" cy="15" r="5.5" fill="none" stroke="#fff" stroke-width="1.5"/>
    <circle cx="59" cy="15" r="5.5" fill="#ff5555"/>
    <path d="M87,12 V9 H90 M96,9 H99 V12 M99,18 V21 H96 M90,21 H87 V18" fill="none" stroke="#fff" stroke-width="1.5"/>
    <circle cx="127" cy="15" r="5.5" fill="none" stroke="#fff" stroke-width="1.5"/>
    <circle cx="127" cy="15" r="2" fill="#ff4433"/>
    <circle cx="161" cy="15" r="4.5" fill="none" stroke="#fff" stroke-width="1.6" stroke-dasharray="2.5 1.8"/>
    <rect x="192" y="10" width="14" height="10" fill="none" stroke="#fff" stroke-width="1.5"/>
    <path d="M227,16 V19 H239 V16 M233,10 V16" fill="none" stroke="#fff" stroke-width="1.5"/>
    <text x="260" y="19.5" fill="#ffffff" font-size="12.5" font-weight="500">Click or drag · Wheel: level · Esc: cancel</text>
  </g>

  <!-- Crosshair Cursor at Top-Left Corner of Targeted Panel (392, 156) -->
  <g transform="translate(392, 156)">
    <line x1="-11" y1="0" x2="-3" y2="0" stroke="#fff" stroke-width="2"/>
    <line x1="3" y1="0" x2="11" y2="0" stroke="#fff" stroke-width="2"/>
    <line x1="0" y1="-11" x2="0" y2="-3" stroke="#fff" stroke-width="2"/>
    <line x1="0" y1="3" x2="0" y2="11" stroke="#fff" stroke-width="2"/>
  </g>

  <!-- 4x Pixel Magnifier Loupe (g_mag: 136x156) -->
  <g filter="url(#sh2)" transform="translate(418, 182)">
    <rect width="150" height="170" fill="#1c1c1e" stroke="#5a5a5f" stroke-width="1.5"/>
    <!-- Zoomed pixel area representing corner around (392, 156) -->
    <rect x="2" y="2" width="146" height="142" fill="#18181b"/>
    <rect x="74" y="72" width="74" height="72" fill="#09090b"/>
    <!-- Magnified red highlight border -->
    <rect x="66" y="64" width="82" height="12" fill="#ff3c3c"/>
    <rect x="66" y="64" width="12" height="80" fill="#ff3c3c"/>
    <!-- Subtle pixel grid -->
    <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1">
      <line x1="25" y1="2" x2="25" y2="144"/>
      <line x1="50" y1="2" x2="50" y2="144"/>
      <line x1="75" y1="2" x2="75" y2="144"/>
      <line x1="100" y1="2" x2="100" y2="144"/>
      <line x1="125" y1="2" x2="125" y2="144"/>
      <line x1="2" y1="26" x2="148" y2="26"/>
      <line x1="2" y1="50" x2="148" y2="50"/>
      <line x1="2" y1="74" x2="148" y2="74"/>
      <line x1="2" y1="98" x2="148" y2="98"/>
      <line x1="2" y1="122" x2="148" y2="122"/>
    </g>
    <!-- Cyan central reticle -->
    <line x1="75" y1="2" x2="75" y2="144" stroke="#00b4ff" stroke-width="1.2"/>
    <line x1="2" y1="73" x2="148" y2="73" stroke="#00b4ff" stroke-width="1.2"/>
    <!-- Bottom readout strip -->
    <rect x="1" y="144" width="148" height="25" fill="#1c1c1e"/>
    <text x="10" y="161" fill="#e4e4e7" font-size="11" font-family="Cascadia Code, Consolas, monospace">392,156 #FF3C3C</text>
  </g>

  <!-- Taskbar -->
  <rect x="0" y="676" width="1280" height="44" fill="#18181b" fill-opacity="0.92"/>
  <circle cx="1174" cy="698" r="6" fill="#0078d7"/>
  <text x="1202" y="702" fill="#e4e4e7" font-size="11.5">16:31</text>
</svg>
